###########
# General #
###########

vo=gpu-next
#gpu-api=vulkan
gpu-api=opengl
#gpu-context=waylandvk
gpu-context=wayland
hwdec=auto-safe
vulkan-async-compute=yes
vulkan-async-transfer=yes
framedrop=no
interpolation=no
tscale=oversample
#clipboard-monitor=no


############
# Playback #
############

deinterlace=yes
demuxer-lavf-analyzeduration=10
demuxer-lavf-buffersize=10485760
demuxer-lavf-probesize=104857600


###########
# Cache   #
###########

cache=yes
cache-secs=600
demuxer-hysteresis-secs=60
demuxer-max-bytes=2GiB
demuxer-max-back-bytes=256MiB
no-cache-pause


##############
# Colorspace #
##############
target-prim=bt.709
target-trc=gamma2.2
video-output-levels=auto
# tone-mapping=bt.2390
tone-mapping=bt.2446a
hdr-compute-peak=yes
hdr-contrast-recovery=0.8


##########
# Dither #
##########

dither-depth=auto
dither=error-diffusion


#############
# Debanding #
#############

deband=yes
deband-iterations=4
deband-threshold=30
deband-range=16
deband-grain=5


################
# Anti-Ringing #
################

scale-antiring=0.6


################
# Audio - High Quality DAC Output (Corrected)
################

# Specify pipewire as the audio output driver.
ao=pipewire

# Set the audio output device if you have multiple.
# Find your DAC's name by running `pw-dump | grep "node.description"` in a terminal.
# If your DAC is your system default, you can leave this commented out.
# audio-device=

# The MODERN replacement for audio-format.
# We request 32-bit float, which is ideal for PipeWire and modern DACs,
# avoiding unnecessary conversions.
# audio-format=floatp

# --- Downmixing for your 2.1 System ---
# audio-channels=stereo
# audio-normalize-downmix=yes


###################################
# Upscaling & Processing Profiles #
###################################

[downscaling]
profile-cond=dwidth < width
glsl-shader="~~/shaders/SSimDownscaler.glsl"

[4k60]
profile-cond=((width ==3840 and height ==2160) and p["estimated-vf-fps"]>=31)
interpolation=no
deband=no
glsl-shader="~~/shaders/KrigBilateral.glsl"

[4k30]
profile-cond=((width ==3840 and height ==2160) and p["estimated-vf-fps"]<31)
interpolation=yes
deband=no
glsl-shader="~~/shaders/KrigBilateral.glsl"

[full-hd60]
profile-cond=((width ==1920 and height ==1080) and not p["video-frame-info/interlaced"] and p["estimated-vf-fps"]>=31)
interpolation=no
glsl-shaders="~~/shaders/FSRCNNX_x2_8-0-4-1.glsl:~~/shaders/KrigBilateral.glsl"

[full-hd30]
profile-cond=((width ==1920 and height ==1080) and not p["video-frame-info/interlaced"] and p["estimated-vf-fps"]<31)
interpolation=yes
glsl-shaders="~~/shaders/FSRCNNX_x2_8-0-4-1.glsl:~~/shaders/KrigBilateral.glsl"

[full-hd-interlaced]
profile-cond=((width ==1920 and height ==1080) and p["video-frame-info/interlaced"] and p["estimated-vf-fps"]<31)
interpolation=yes
glsl-shaders="~~/shaders/FSRCNNX_x2_8-0-4-1.glsl:~~/shaders/KrigBilateral.glsl"

[hd]
profile-cond=(width <= 1280 and height <= 720)
interpolation=no
cscale=spline36
scale=ewa_lanczossharp
glsl-shader="~~/shaders/KrigBilateral.glsl"


###################################
# Protocol Specific Configuration #
###################################

[protocol.http]
hls-bitrate=max

[protocol.https]
profile=protocol.http

[protocol.ytdl]
profile=protocol.http
