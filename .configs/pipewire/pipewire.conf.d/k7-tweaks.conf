context.properties = {
    # Allow the DAC to switch between these rates based on the source material
    default.clock.allowed-rates = [ 44100 48000 88200 96000 176400 192000 352800 384000 ]

    # Lowest latency settings (requires a stable system)
    default.clock.quantum       = 1024
    default.clock.min-quantum   = 32
    default.clock.max-quantum   = 4096

    # This ensures the internal graph stays at a high bit depth
    default.clock.format = "F32"
    # Match the hardware's preferred high-end rate as a default
    # default.clock.rate = 192000
}

stream.properties = {
    # Use higher quality resampling if a rate change is forced
    resample.quality      = 14
    channelmix.normalize  = true
}

monitor.alsa.rules = [
  {
    matches = [
      {
        # Using the exact name you found with wpctl
        node.name = "alsa_output.usb-GuangZhou_FiiO_Electronics_Co._Ltd_FiiO_K7-00.pro-output-0"
      }
    ]

    actions = {
      update-props = {
        audio.format        = "S32_LE"
        # This forces the hardware to match the stream rate immediately
        node.force-rate     = 0
        # Increase headroom for high-res streams
        api.alsa.period-size = 1024
        api.alsa.headroom    = 512
      }
    }
  }
]

stream.rules = [
    {
        matches = [
            {
                # Identify CAVA specifically
                client.name = "cava"
            }
        ]
        actions = {
            update-props = {
                # This prevents CAVA from influencing the hardware clock
                node.passive = true
                # Forces CAVA to do the resampling work itself
                #node.force-rate = 48000
            }
        }
    }
]
