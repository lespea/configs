<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<!-- Install to /etc/dbus-1/system.d/steam-fake-nm.conf with `just steam-nm-policy`.
     Lets steam-fake-nm.service (user unit) own the NetworkManager name on the
     system bus. Do not install alongside a real NetworkManager. -->
<busconfig>
  <policy user="adam">
    <allow own="org.freedesktop.NetworkManager"/>
  </policy>
  <policy context="default">
    <allow send_destination="org.freedesktop.NetworkManager"/>
  </policy>
</busconfig>
